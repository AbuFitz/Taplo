name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAPLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        id: dependencies
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: browser-evidence
          path: |
            shots/p02-*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 7
