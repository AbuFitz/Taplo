name: CI
on: [push, pull_request]
concurrency:
  group: taplo-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAPLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        id: dependencies
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Blueprint first journey, category search and in-place Studio setup
        run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e -- tests/e2e/blueprint-first-journey.spec.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e -- tests/e2e/operational-shell.spec.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Starting-look navigation on phone and desktop
        run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e -- tests/e2e/appearance-task-navigation.spec.ts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Mobile preview space and validation recovery
        run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e -- tests/e2e/setup-form.spec.ts --grep "invalid page link|enlarging the live preview|service duration errors"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: browser-evidence
          path: |
            shots/p02-*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Public theme contrast and design-control regression
        run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e -- tests/e2e/controls.spec.ts tests/e2e/a11y.spec.ts --grep "public profile|design controls" --max-failures=5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: public-control-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  browser-regression:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: PW_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-regression-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
