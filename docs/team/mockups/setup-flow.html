<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taplo setup mockup</title>
<style>
:root{--ink:#0b0b0c;--mute:#6b6f76;--line:#e7e8ea;--bg:#f6f6f4;--pill:999px}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.04em}.bar{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);width:25%;transition:width .35s}
.exit{font-size:14px;color:var(--mute);text-decoration:none}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px;min-height:0}
.phone{width:210px;height:250px;margin:4px 0 -40px;border:6px solid #111;border-bottom:0;border-radius:34px 34px 0 0;overflow:hidden;position:relative;background:var(--pbg,#efe9df);transition:background .4s,transform .4s;flex:none}
.phone::after{content:"";position:absolute;inset:auto 0 0;height:70px;background:linear-gradient(transparent,var(--bg))}
.pi{padding:22px 16px;text-align:center;color:var(--pfg,#2a211a);transition:color .4s}
.av{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;background:var(--pac,#8a5a3c);display:grid;place-items:center;color:#fff;font-weight:700}
.pn{font-weight:700;font-size:17px;letter-spacing:-.02em;min-height:22px}.pt{font-size:11px;opacity:.7;margin:2px 0 12px;min-height:14px}
.pb{border-radius:var(--pill);background:var(--pac,#8a5a3c);color:#fff;font-size:11px;padding:9px;margin:6px 6px 0;font-weight:600}.pb.o{background:transparent;color:inherit;border:1px solid currentColor;opacity:.8}
.sheet{width:100%;max-width:420px;background:#fff;border-radius:28px 28px 0 0;padding:26px 20px 20px;margin-top:auto;box-shadow:0 -10px 40px rgba(0,0,0,.06);position:relative;z-index:2}
h1{font-size:28px;letter-spacing:-.035em;line-height:1.1;margin-bottom:6px}.sub{color:var(--mute);font-size:15px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.t{border:1.5px solid var(--line);border-radius:18px;padding:14px;font-size:15px;font-weight:600;background:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:76px;font-family:inherit;color:inherit}
.t span{font-size:22px}.t[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
label{font-size:13px;color:var(--mute);display:block;margin:0 0 6px 4px}
input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:var(--pill);padding:0 20px;font-size:17px;font-family:inherit;outline:0}input:focus{border-color:var(--ink)}
.url{margin:10px 0 0 4px;font-size:14px;color:var(--mute)}.url b{color:var(--ink)}.ok{color:#0a7d3c}
.cta{width:100%;height:54px;border:0;border-radius:var(--pill);background:var(--ink);color:#fff;font-size:17px;font-weight:600;margin-top:18px;font-family:inherit;cursor:pointer}.cta:disabled{background:#d9dadc;color:#8c8f94}
.back{display:block;text-align:center;margin-top:12px;color:var(--mute);font-size:14px;background:none;border:0;width:100%;font-family:inherit;cursor:pointer;padding:10px}
.looks{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 14px}.looks::-webkit-scrollbar{display:none}
.l{flex:0 0 118px;scroll-snap-align:center;border:2px solid transparent;border-radius:20px;background:none;padding:0;cursor:pointer;font-family:inherit}.l[aria-pressed=true]{border-color:var(--ink)}
.lc{height:170px;border-radius:16px;padding:14px 10px;text-align:center;font-size:11px}.lc .a{width:30px;height:30px;border-radius:50%;margin:0 auto 6px}.lc b{display:block;font-size:12px}.lc i{display:block;height:18px;border-radius:99px;margin-top:8px}
.ln{font-size:13px;font-weight:600;margin:8px 0 2px}
[hidden]{display:none!important}
</style></head><body>
<header><span class="logo">Taplo</span><div class="bar"><i id="p"></i></div><a class="exit" href="#">Save and exit</a></header>
<div class="stage">
<div class="phone" id="phone"><div class="pi"><div class="av" id="av">B</div><div class="pn" id="pn">Your business</div><div class="pt" id="pt">What you do, in a line</div><div class="pb" id="b1">Book now</div><div class="pb o" id="b2">Call</div></div></div>
<main class="sheet">
<section id="s1"><h1>What do you do?</h1><p class="sub">We'll build the page around it.</p>
<div class="tiles" id="tiles"></div></section>
<section id="s2" hidden><h1>What's it called?</h1><p class="sub">Your name goes on the page and in your link.</p>
<label for="n">Business name</label><input id="n" autocomplete="off" placeholder="Fade Street Barbers"><p class="url">mytaplo.com/<b id="u">your-name</b> <span class="ok" id="ok"></span></p>
<button class="cta" id="c2" disabled>Continue</button><button class="back" data-b>Back</button></section>
<section id="s3" hidden><h1>Pick a look.</h1><p class="sub">This is your page. Change it any time.</p>
<div class="looks" id="looks"></div><button class="cta" id="c3">Build my page</button><button class="back" data-b>Back</button></section>
</main></div>
<script>
const T=[["Barber","✂️","Book a cut","Call"],["Cleaner","✨","Get a quote","Call"],["Trades","🔧","Request a visit","Call"],["Car dealer","🚗","View stock","Call"],["Trainer","💪","Book a session","Message"],["Café","☕","See the menu","Directions"],["Photographer","📷","Enquire","Message"],["Something else","＋","Get in touch","Call"]];
const L=[["Sand","#efe9df","#2a211a","#8a5a3c"],["Ink","#111214","#f4f4f2","#e9e4d8"],["Mist","#e8eef0","#16242a","#2f6f7e"],["Moss","#e5eadf","#1b2a1d","#3f6b3a"],["Cream","#faf5ea","#2b2316","#c2410c"]];
let st={t:0,n:"",l:0},step=1;const $=id=>document.getElementById(id);
$("tiles").innerHTML=T.map((t,i)=>`<button class="t" data-i="${i}" aria-pressed="false"><span>${t[1]}</span>${t[0]}</button>`).join("");
$("looks").innerHTML=L.map((l,i)=>`<button class="l" data-l="${i}" aria-pressed="${i==0}"><div class="lc" style="background:${l[1]};color:${l[2]}"><div class="a" style="background:${l[3]}"></div><b class="ln2">Your name</b>${T[0][0]}<i style="background:${l[3]}"></i><i style="border:1px solid ${l[3]}"></i></div><div class="ln">${l[0]}</div></button>`).join("");
function paint(){const l=L[st.l],t=T[st.t],name=st.n||"Your business";const p=$("phone").style;p.setProperty("--pbg",l[1]);p.setProperty("--pfg",l[2]);p.setProperty("--pac",l[3]);$("pn").textContent=name;$("av").textContent=name[0].toUpperCase();$("pt").textContent=st.n?t[0]+" · St Albans":t[0];$("b1").textContent=t[2];$("b2").textContent=t[3];document.querySelectorAll(".ln2").forEach(e=>e.textContent=name);document.querySelectorAll(".lc").forEach((e,i)=>e.lastElementChild.previousElementSibling.previousElementSibling&&0)}
function go(n){step=n;for(let i=1;i<4;i++)$("s"+i).hidden=i!=n;$("p").style.width=n*33.3+"%";if(n==2)setTimeout(()=>$("n").focus(),50)}
$("tiles").onclick=e=>{const b=e.target.closest(".t");if(!b)return;st.t=+b.dataset.i;document.querySelectorAll(".t").forEach(x=>x.setAttribute("aria-pressed",x==b));paint();setTimeout(()=>go(2),450)};
$("n").oninput=e=>{st.n=e.target.value.trim();$("u").textContent=(st.n||"your-name").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");$("ok").textContent=st.n?"✓ available":"";$("c2").disabled=!st.n;paint()};
$("c2").onclick=()=>{go(3);paint()};$("c3").onclick=()=>{location.hash="#done"};
$("looks").onclick=e=>{const b=e.target.closest(".l");if(!b)return;st.l=+b.dataset.l;document.querySelectorAll(".l").forEach(x=>x.setAttribute("aria-pressed",x==b));paint()};
document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>go(step-1));
if(location.hash.startsWith("#demo")){st={t:0,n:"Fade Street Barbers",l:+(location.hash.split("-")[2]||0)};const s=+(location.hash.split("-")[1]||1);document.querySelector(".t").setAttribute("aria-pressed","true");$("n").value=st.n;$("u").textContent="fade-street-barbers";$("ok").textContent="✓ available";$("c2").disabled=false;go(s);paint()}
</script></body></html>
